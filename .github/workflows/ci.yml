name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: verifier
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: verifier/go.mod
          cache-dependency-path: verifier/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: go vet
        run: go vet ./...
      - name: go mod tidy is a no-op
        run: |
          cp go.mod /tmp/go.mod && cp go.sum /tmp/go.sum
          go mod tidy
          diff -u /tmp/go.mod go.mod && diff -u /tmp/go.sum go.sum
      - name: go test
        run: go test -race -count=1 ./...
      - name: build
        run: go build -trimpath -buildvcs=false -o /tmp/tee-verify . && /tmp/tee-verify -h 2>&1 | head -3

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: terraform fmt
        run: terraform fmt -check -recursive -diff
      - name: terraform validate
        run: |
          terraform init -backend=false -input=false
          terraform validate -no-color

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck -S warning tools/*.sh
